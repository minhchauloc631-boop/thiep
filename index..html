
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng ngày 20/10!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6e8 0%, #ecd1e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Container chính */
        .card-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(220, 90, 130, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
        }

        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.sub-title {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Biểu tượng trái tim tim đập */
        .heart {
            font-size: 60px;
            color: #e63946;
            margin: 15px 0;
            animation: beat 1.2s infinite ease-in-out;
            cursor: pointer;
            display: inline-block;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* Nút mở thư */
        .btn-open {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-open:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
        }

        /* Bức thư ẩn */
        .letter-content {
            display: none;
            margin-top: 20px;
            text-align: left;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #ff4d6d;
            animation: fadeIn 0.8s ease forwards;
            line-height: 1.6;
            color: #4a4a4a;
            max-height: 250px;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hiệu ứng hoa rơi Canvas */
        #petalCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="petalCanvas"></canvas>

    <div class="card-container">
        <h1>Happy Women's Day</h1>
        <p class="sub-title">Chúc mừng Ngày Phụ Nữ Việt Nam 20/10 ✨</p>
        
        <div class="heart" onclick="toggleLetter()">❤️</div>
        
        <br>
        <button class="btn-open" onclick="toggleLetter()">Mở lời chúc 💌</button>

        <div class="letter-content" id="letter">
            <p><strong>gửi chị em 10A3K61.</strong></p>
            <br>
            <p>Nhân ngày 20/10, chúc các bạn luôn xinh đẹp, rạng rỡ, hạnh phúc và luôn tràn ngập niềm vui trong cuộc sống!</p>
            <br>
            <p>cảm ơn vì đã xem.</p>
        </div>
    </div>

    <script>
        // Mở / Đóng Bức Thư
        function toggleLetter() {
            const letter = document.getElementById('letter');
            if (letter.style.display === 'block') {
                letter.style.display = 'none';
            } else {
                letter.style.display = 'block';
            }
        }

        // Tạo hiệu ứng cánh hoa rơi (Canvas Animation)
        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const petals = [];
        const totalPetals = 35;

        class Petal {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.5 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.02 - 0.01;
                this.color = ['#ffb7b2', '#ff9aa2', '#e2f0cb', '#ffdac1', '#e0bbe4'][Math.floor(Math.random() * 5)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;

                if (this.y > height) {
                    this.y = -10;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < totalPetals; i++) {
            petals.push(new Petal());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
